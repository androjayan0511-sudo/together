services:
  - type: web
    name: togethermiles
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: DATABASE_PATH
        value: /var/data/togethermiles.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CORS_ORIGIN
        value: "*"
    disk:
      name: togethermiles-data
      mountPath: /var/data
      sizeGB: 1
